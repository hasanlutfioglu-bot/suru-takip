<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sürü Takip V19</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f7f3}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="./v18.html?v=19"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow, d=frame.contentDocument;
  try{
    const oldOpen=w.openAdd;
    const oldRenderReports=w.renderReports;

    w.isAutoSaleCandidate=function(a){
      if(!a || !w.isActiveAnimal(a) || a.type!=='Kuzu' || a.sex!=='Erkek' || !a.birth) return false;
      const birth=new Date(a.birth+'T00:00:00');
      if(Number.isNaN(birth.getTime())) return false;
      const ageDays=(Date.now()-birth.getTime())/864e5;
      return ageDays >= (5.5*30.44);
    };

    w.isSaleCandidate=function(a){
      return !!a && (a.status==='Satılacak' || w.isAutoSaleCandidate(a));
    };

    w.syncBirthSexes=function(){
      const count=d.getElementById('count');
      const hidden=d.getElementById('sexes');
      if(!count||!hidden)return;
      const n=+count.value||1;
      const values=[];
      for(let i=0;i<n;i++){
        values.push(d.getElementById('birthSex_'+i)?.value||'Bilinmiyor');
      }
      hidden.value=values.join(',');
    };

    w.renderBirthSexFields=function(){
      const box=d.getElementById('birthSexFields');
      const sel=d.getElementById('count');
      if(!box||!sel)return;
      const n=+sel.value||1;
      let out='<label>Kuzuların cinsiyeti</label>';
      for(let i=0;i<n;i++){
        out+='<div class="row" style="gap:8px;margin:5px 0 8px"><b style="min-width:62px">Kuzu '+(i+1)+'</b><select id="birthSex_'+i+'" onchange="syncBirthSexes()" style="margin:0;flex:1"><option value="Erkek">Erkek</option><option value="Dişi">Dişi</option></select></div>';
      }
      box.innerHTML=out;
      w.syncBirthSexes();
    };

    w.openAdd=function(kind){
      oldOpen(kind);
      if(kind==='birth'){
        const count=d.getElementById('count');
        const sexes=d.getElementById('sexes');
        if(count&&sexes){
          count.setAttribute('onchange','renderBirthSexFields()');
          sexes.style.display='none';
          const label=sexes.previousElementSibling;
          if(label&&label.tagName==='LABEL')label.style.display='none';

          const holder=d.createElement('div');
          holder.id='birthSexFields';
          sexes.insertAdjacentElement('afterend',holder);
          w.renderBirthSexFields();
        }
      }
    };

    w.renderReports=function(){
      oldRenderReports();
      const box=d.getElementById('rSaleCandidates');
      if(box){
        const active=w.db.animals.filter(w.isActiveAnimal);
        box.textContent=active.filter(w.isSaleCandidate).length;
        const label=box.nextElementSibling;
        if(label)label.textContent='Satış adayı';
      }
    };

    w.openCandidateSale=function(){
      const ids=[...d.querySelectorAll('.candidateSalePick:checked')].map(x=>x.value);
      if(!ids.length)return w.toast('En az bir hayvan seç');
      const animals=ids.map(id=>w.db.animals.find(a=>a.id===id)).filter(Boolean);
      w.showModal('Seçilenleri Sat',`
        <div class="card"><b>${animals.length} hayvan seçildi</b><div class="muted" style="margin-top:6px">${animals.map(a=>w.animalName(a)).join(', ')}</div></div>
        <label>Toplam satış geliri (TL)</label><input id="candidateSaleAmount" type="number" inputmode="decimal">
        <label>Satış tarihi</label><input id="candidateSaleDate" type="date" value="${w.today()}">
        <label>Açıklama</label><input id="candidateSaleNote" placeholder="İsteğe bağlı">
        <button class="primary" onclick="submitCandidateSale()">Satışı Kaydet</button>
      `);
      w._candidateSaleIds=ids;
    };

    w.submitCandidateSale=function(){
      const ids=w._candidateSaleIds||[];
      const amount=+d.getElementById('candidateSaleAmount')?.value||0;
      const saleDate=d.getElementById('candidateSaleDate')?.value||w.today();
      const note=(d.getElementById('candidateSaleNote')?.value||'').trim();
      if(!ids.length)return w.toast('Seçili hayvan yok');
      if(!amount)return w.toast('Satış tutarı gir');
      if(!w.canAddFinance(1))return w.showFinancePlusRequired();
      const arr=ids.map(id=>w.db.animals.find(a=>a.id===id)).filter(a=>a&&w.isActiveAnimal(a));
      if(!arr.length)return w.toast('Satılabilir hayvan bulunamadı');
      const names=arr.map(w.animalName), previousStatuses={};
      arr.forEach(a=>{previousStatuses[a.id]=a.status;a.status='Satıldı'});
      w.db.records.push({
        id:w.uid('rec'),kind:'sale',label:'Satış · '+arr.length+' hayvan',
        category:'Kuzu/Hayvan satışı',amount,date:saleDate,note,
        animalIds:arr.map(a=>a.id),animalNames:names,previousStatuses,source:'sale_candidates'
      });
      w._candidateSaleIds=[];
      w.save();w.closeModal();w.toast(arr.length+' hayvan satıldı; gelir kaydına işlendi');
    };

    w.renderHerd=function(){
      let filters=['Tümü','Anaçlar','Anaç Adayları','Kuzular','Erkek Kuzular','Dişi Kuzular','Koç','Satılacaklar','Takipte','Pasif'];
      w.herdTabs.innerHTML=filters.map(f=>'<button class="tab '+(w.herdFilter===f?'active':'')+'" onclick="herdFilter=\''+f+'\';renderHerd()">'+f+'</button>').join('');
      let q=(w.herdSearch?.value||'').toLowerCase();
      let arr=w.db.animals.filter(a=>{
        let ok=w.herdFilter==='Tümü'
          ||(w.herdFilter==='Anaçlar'&&a.type==='Koyun'&&a.breedingStatus!=='Anaç Adayı'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Anaç Adayları'&&a.breedingStatus==='Anaç Adayı'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Kuzular'&&a.type==='Kuzu'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Erkek Kuzular'&&a.type==='Kuzu'&&a.sex==='Erkek'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Dişi Kuzular'&&a.type==='Kuzu'&&a.sex==='Dişi'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Koç'&&a.type==='Koç'&&w.isActiveAnimal(a))
          ||(w.herdFilter==='Satılacaklar'&&w.isSaleCandidate(a))
          ||(w.herdFilter==='Takipte'&&a.status==='Takipte')
          ||(w.herdFilter==='Pasif'&&['Satıldı','Öldü','Kesildi'].includes(a.status));
        return ok&&((a.tag||'').toLowerCase().includes(q)||a.type.toLowerCase().includes(q)||a.status.toLowerCase().includes(q));
      });
      const saleMode=w.herdFilter==='Satılacaklar';
      const saleBar=saleMode&&arr.length?'<div class="card" style="margin-bottom:10px"><div class="row"><div><b>Satış adayları</b><div class="muted">Satacağın kuzuları seç</div></div><button class="primary small" onclick="openCandidateSale()">Seçilenleri Sat</button></div></div>':'';
      w.herdList.innerHTML=saleBar+(arr.length?arr.map(a=>{
        const auto=w.isAutoSaleCandidate(a)&&a.status!=='Satılacak';
        const pick=saleMode?'<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input class="candidateSalePick" type="checkbox" value="'+a.id+'"><b>Satışa seç</b></label>':'';
        return '<div class="card">'+pick+'<div class="row"><div><b>'+w.animalName(a)+'</b><div class="muted">'+a.sex+' · '+w.age(a.birth)+' · '+(a.weight?a.weight+' kg · ':'')+a.status+(auto?' · Satış adayı':'')+'</div></div><span class="tag">'+a.type+'</span></div><div style="margin-top:10px"><button class="small" onclick="editTag(\''+a.id+'\')">'+(a.tag?'Küpe Düzenle':'Küpe No Ekle')+'</button> <button class="small" onclick="animalCard(\''+a.id+'\')">Kartı Aç</button></div></div>';
      }).join(''):'<div class="empty">Bu filtrede hayvan yok.</div>');
    };

    const badge=d.querySelector('h1 span');
    if(badge)badge.textContent='V19';
    w.renderAll();
  }catch(e){
    console.error('V19 patch error',e);
  }
});
</script>
</body>
</html>
