plugins { id 'com.android.application' }
def releaseStore = System.getenv('ANDROID_KEYSTORE_PATH')
def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def signingValues = [releaseStore, releasePassword, releaseAlias, releaseKeyPassword]
def signingRequested = signingValues.any { it != null }
if (signingRequested && signingValues.any { !it?.trim() }) {
 throw new GradleException('All four Android signing environment variables are required.')
}
if (signingRequested && !file(releaseStore).isFile()) {
 throw new GradleException('Android signing keystore file is missing.')
}
android {
 namespace 'com.hasanlutfioglu.surutakip'
 compileSdk 36
 defaultConfig {
  applicationId 'com.hasanlutfioglu.surutakip'
  minSdk 24
  targetSdk 36
  versionCode 2
  versionName '1.0.1'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs {
  if (signingRequested) {
   release {
    storeFile file(releaseStore)
    storePassword releasePassword
    keyAlias releaseAlias
    keyPassword releaseKeyPassword
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (signingRequested) signingConfig signingConfigs.release
  }
 }
}
dependencies {
 implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
 implementation 'com.google.androidbrowserhelper:billing:1.0.0-alpha05'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
